<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Threads Monitor Bot — Legal</title>
  <style>
    :root {
      --bg: #f7f4ef;
      --ink: #1a1a1a;
      --muted: #5c5c5c;
      --accent: #0b5fff;
      --card: #fffdf9;
      --line: #e5dfd4;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
      background:
        radial-gradient(1200px 600px at 10% -10%, #efe6d8 0%, transparent 55%),
        radial-gradient(900px 500px at 100% 0%, #dde8f7 0%, transparent 50%),
        var(--bg);
      color: var(--ink);
      line-height: 1.65;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem 1rem;
    }
    .card {
      max-width: 520px;
      width: 100%;
      background: var(--card);
      border: 1px solid var(--line);
      padding: 2rem 1.75rem;
    }
    h1 {
      margin: 0 0 0.5rem;
      font-size: 1.85rem;
      line-height: 1.2;
    }
    p { color: var(--muted); margin: 0 0 1.5rem; }
    a {
      display: block;
      color: var(--accent);
      margin: 0.65rem 0;
      font-size: 1.05rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Threads Monitor Bot</h1>
    <p>Legal documents for Meta App Review and users of the Telegram bot.</p>
    <a href="privacy-policy.html">Privacy Policy</a>
    <a href="terms.html">Terms of Service</a>
    <a href="data-deletion.html">Data Deletion Instructions</a>
  </div>
</body>
</html>
